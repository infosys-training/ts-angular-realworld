{% extends "base.html" %} {% block title %}New Incident - Incident Management{% endblock %} {% block content %}
<div class="page-header">
  <h2>Create New Incident</h2>
</div>

<div class="card">
  <form method="post" action="/incidents/new">
    <div class="form-group">
      <label>Title *</label>
      <input type="text" name="title" required placeholder="Brief description of the incident" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4" placeholder="Detailed description of the incident..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label>Assign To</label>
        <select name="assignee_id">
          <option value="">Unassigned</option>
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Create Incident</button>
      <a href="/incidents" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
