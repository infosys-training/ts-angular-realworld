{% extends "base.html" %} {% block title %}New User - Incident Management{% endblock %} {% block content %}
<div class="page-header">
  <h2>Create New User</h2>
</div>

<div class="card">
  <form method="post" action="/users/new">
    <div class="form-group">
      <label>Username *</label>
      <input type="text" name="username" required placeholder="e.g. john_doe" />
    </div>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" name="full_name" required placeholder="e.g. John Doe" />
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" name="email" required placeholder="e.g. john@example.com" />
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Create User</button>
      <a href="/users" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
